<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102033">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Robot Tank Controller</title>
    <link rel="manifest" href="{{ url_for('static', filename='dist/manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='dist/icon-tank.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__TANK_APP_CONFIG__ = {
        cameraStreamPort: {{ camera_stream_port|tojson }},
        secondaryCameraStreamPort: {{ secondary_camera_stream_port|tojson }},
      };
    </script>
    <script type="module" src="{{ url_for('static', filename='dist/app.js') }}"></script>
  </body>
</html>
